services:
  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      RESOURCEHUB_OPS_PASSWORD: ${RESOURCEHUB_OPS_PASSWORD:-}
      RESOURCEHUB_FEISHU_NOTIFY: ${RESOURCEHUB_FEISHU_NOTIFY:-}
      RESOURCEHUB_FEISHU_WEBHOOK: ${RESOURCEHUB_FEISHU_WEBHOOK:-}
      RESOURCEHUB_FEISHU_SECRET: ${RESOURCEHUB_FEISHU_SECRET:-}
    volumes:
      - server-data:/data
    command: ["-addr", ":8080", "-db", "/data/resourcehub.db"]

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  server-data:
